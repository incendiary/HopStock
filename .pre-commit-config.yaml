repos:
  # Layer 1: pattern matching — fast, catches obvious secrets locally
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # Layer 2: Prettier — JS/Vue/CSS formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^client/src/.*\.(js|vue|css)$
        additional_dependencies:
          - prettier@3.8.4

  # Layer 3: ESLint — Vue 3 + JS code quality
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (client)
        language: node
        entry: npm run lint -w client --
        pass_filenames: false
        files: ^client/src/.*\.(js|vue)$
